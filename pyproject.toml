[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "pare-quant"
version = "0.1.3"
description = "A unified, architecture-agnostic library for post-training quantization of large language models"
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yasmin Moslem" }]
keywords = ["quantization", "llm", "multimodal", "machine-learning", "nlp", "gptq", "awq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
transformers = ["transformers>=4.40.0"]
calibration = ["datasets>=2.18.0"]
kernels = ["triton>=3.0.0"]
eval = ["datasets>=2.18.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
all = [
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "triton>=3.0.0",
]

[project.scripts]
pare = "pare.__main__:main"

# PyPI long description is built from README.md, minus the "Other resources"
# block (which stays on the GitHub README only).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)\n\nOther resources:.*?(?=\n\n## Citation)'
replacement = ''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "smoke: end-to-end tests on GPT-2 + WikiText-2 (requires internet, CPU-only, opt-in with --smoke)",
    "gpu: tests that require a CUDA-capable GPU",
]

[tool.hatch.build.targets.wheel]
packages = ["pare"]
