site_name: Pare
site_description: Production-ready quantization for large language and multimodal models
site_author: Yasmin Moslem
repo_url: https://github.com/TinyAdapt/Pare
repo_name: TinyAdapt/Pare

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TinyAdapt/Pare
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pare-quant
